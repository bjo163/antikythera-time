name: U-Time conformance report
description: Report an independent implementation or conformance discrepancy
title: "[Conformance] "
labels: ["conformance"]
body:
  - type: input
    id: implementation
    attributes: {label: Implementation, description: Language/project/version}
    validations: {required: true}
  - type: input
    id: spec
    attributes: {label: U-Time spec version, placeholder: "2.0.0"}
    validations: {required: true}
  - type: textarea
    id: vectors
    attributes: {label: Failing/passing vectors and results}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: Environment and reproducibility steps}
    validations: {required: true}
  - type: textarea
    id: interpretation
    attributes: {label: Interpretation or suspected discrepancy}
