name: erfa-dtr-benchmark

on:
  push:
    paths:
      - "src/relativity/dtr.js"
      - "src/relativity/**"
      - "scripts/generate-erfa-dtr.py"
      - "scripts/check-erfa-dtr.mjs"
      - ".github/workflows/erfa-dtr-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install pyerfa
      - run: python scripts/generate-erfa-dtr.py
      - run: node scripts/check-erfa-dtr.mjs artifacts/erfa-dtr-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: erfa-dtr-benchmark
          path: artifacts/
