name: v2-release

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "spec/**"
      - "src/v2/**"
      - "reference-python/**"
      - "reference-rust/**"
      - "benchmarks/**"
      - "scripts/build-v2-release.mjs"
      - "scripts/utime-conformance.mjs"
      - ".github/workflows/v2-release.yml"

jobs:
  release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm test
      - run: node scripts/utime-conformance.mjs spec/v2-conformance-corpus.json
      - run: node scripts/generate-js-v1-vectors.mjs
      - run: python reference-python/utime_v1.py
      - run: cargo run --quiet --manifest-path reference-rust/Cargo.toml
      - run: node scripts/check-v2-compat.mjs
      - run: node scripts/build-v2-release.mjs
      - name: Package candidate
        run: |
          tar -czf artifacts/utime-2.0.0-standardization-candidate.tar.gz             spec src/v2 reference-python reference-rust benchmarks             README.md GOVERNANCE.md CONTRIBUTING.md SECURITY.md CHANGELOG.md CITATION.cff             docs/preprint.md docs/standardization-readiness.md docs/standards-mapping.md
          sha256sum artifacts/utime-2.0.0-standardization-candidate.tar.gz > artifacts/utime-2.0.0-standardization-candidate.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: utime-2.0.0-standardization-candidate
          path: artifacts/
