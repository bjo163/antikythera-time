name: static-site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "site.js"
      - "styles.css"
      - "src/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html site.js styles.css _site/
          cp -R src _site/src
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: utime-static-site
          path: _site
          if-no-files-found: error
