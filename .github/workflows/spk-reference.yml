name: m-time-spk-reference
on:
  workflow_dispatch:
  push:
    paths:
      - "crates/mtime-spk/**"
      - "crates/mtime-jpl/**"
      - ".github/workflows/spk-reference.yml"

jobs:
  de440:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Download official NAIF DE440 short kernel
        run: |
          curl --fail --retry 5 --retry-delay 3             "https://naif.jpl.nasa.gov/pub/naif/JUNO/kernels/spk/de440s.bsp"             -o /tmp/de440s.bsp
          test -s /tmp/de440s.bsp
          sha256sum /tmp/de440s.bsp | tee /tmp/de440s.sha256
      - name: Query Horizons geometric Sun/Moon vectors at fixed TDB epoch
        run: |
          COMMON="OBJ_DATA=%27NO%27&MAKE_EPHEM=%27YES%27&EPHEM_TYPE=%27VECTORS%27&CENTER=%27500%40399%27&TLIST=%272461119.0%27&TLIST_TYPE=%27JD%27&TIME_TYPE=%27TDB%27&OUT_UNITS=%27KM-S%27&VEC_TABLE=%271%27&VEC_CORR=%27NONE%27&VEC_LABELS=%27NO%27&CSV_FORMAT=%27YES%27&CAL_FORMAT=%27JD%27&REF_PLANE=%27FRAME%27&REF_SYSTEM=%27ICRF%27"
          curl --fail --retry 5 --retry-delay 3             "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND=%2710%27&$COMMON"             -o /tmp/horizons-sun.txt
          curl --fail --retry 5 --retry-delay 3             "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND=%27301%27&$COMMON"             -o /tmp/horizons-moon.txt
          grep -q '$$SOE' /tmp/horizons-sun.txt
          grep -q '$$SOE' /tmp/horizons-moon.txt
      - name: Compare offline SPK vectors with Horizons
        run: |
          cargo run -p mtime-spk --example validate_horizons --             /tmp/de440s.bsp /tmp/horizons-sun.txt /tmp/horizons-moon.txt 2461119.0

      - uses: actions/upload-artifact@v4
        with:
          name: mtime-de440-reference
          path: |
            /tmp/de440s.sha256
            /tmp/horizons-sun.txt
            /tmp/horizons-moon.txt
