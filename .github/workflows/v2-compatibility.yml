name: v2-compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "reference-rust/**"
      - "reference-python/**"
      - "src/**"
      - "spec/**"
      - "scripts/generate-js-v1-vectors.mjs"
      - "scripts/check-v2-compat.mjs"
      - ".github/workflows/v2-compatibility.yml"

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: dtolnay/rust-toolchain@stable
      - run: node scripts/generate-js-v1-vectors.mjs
      - run: python reference-python/utime_v1.py
      - run: cargo run --quiet --manifest-path reference-rust/Cargo.toml
      - run: node scripts/check-v2-compat.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: v2-compatibility
          path: artifacts/
