name: m-time-offline-ephemeris

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/mtime-spk/**"
      - "crates/mtime-jpl/**"
      - ".github/workflows/offline-ephemeris.yml"

jobs:
  de440s-vs-horizons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Download official JPL/NAIF DE440s kernel
        run: |
          curl --fail --retry 5 --retry-delay 3             -o /tmp/de440s.bsp             https://naif.jpl.nasa.gov/pub/naif/LUCY/kernels/spk/de440s.bsp
          sha256sum /tmp/de440s.bsp | tee /tmp/de440s.sha256
          test "$(stat -c%s /tmp/de440s.bsp)" -gt 30000000

      - name: Query matching Horizons Earth-centered geometric vectors
        run: |
          COMMON="OBJ_DATA=%27NO%27&MAKE_EPHEM=%27YES%27&EPHEM_TYPE=%27VECTORS%27&CENTER=%27500%40399%27&TLIST=%272461119.0%27&TLIST_TYPE=%27JD%27&TIME_TYPE=%27TDB%27&OUT_UNITS=%27KM-S%27&VEC_TABLE=%271%27&VEC_CORR=%27NONE%27&VEC_LABELS=%27NO%27&CSV_FORMAT=%27YES%27&CAL_FORMAT=%27JD%27"
          curl --fail --retry 5 --retry-delay 3             "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND=%2710%27&$COMMON"             -o /tmp/horizons-sun.txt
          curl --fail --retry 5 --retry-delay 3             "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND=%27301%27&$COMMON"             -o /tmp/horizons-moon.txt
          grep -q '\$\$SOE' /tmp/horizons-sun.txt
          grep -q '\$\$SOE' /tmp/horizons-moon.txt

      - name: Compare offline DE440s with Horizons
        run: |
          cargo run -p mtime-spk --example compare_de440s_horizons --             /tmp/de440s.bsp /tmp/horizons-sun.txt /tmp/horizons-moon.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mtime-de440s-benchmark
          path: |
            /tmp/de440s.sha256
            /tmp/horizons-sun.txt
            /tmp/horizons-moon.txt
