name: iers-eop

on:
  workflow_dispatch:
  push:
    paths:
      - "src/eop/**"
      - "src/observer.js"
      - "scripts/iers-eop-snapshot.mjs"
      - ".github/workflows/iers-eop.yml"

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/iers-eop-snapshot.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: iers-eop-snapshot
          path: artifacts/
