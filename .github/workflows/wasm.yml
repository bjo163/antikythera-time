name: m-time-wasm
on:
  workflow_dispatch:
  push:
    paths:
      - "crates/mtime-wasm/**"
      - "crates/mtime-core/**"
      - "crates/mtime-timescales/**"
      - "crates/mtime-hijri/**"
      - ".github/workflows/wasm.yml"
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build -p mtime-wasm --target wasm32-unknown-unknown --release
