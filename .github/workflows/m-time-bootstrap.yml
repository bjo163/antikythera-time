name: m-time-rust-bootstrap
on:
  workflow_dispatch:
  push:
    branches: [m-time-bootstrap]
    paths:
      - "m-time/**"
      - ".github/workflows/m-time-bootstrap.yml"
jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m-time
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo run -p mtime-cli
