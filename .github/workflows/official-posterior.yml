name: official-posterior

on:
  workflow_dispatch:
  push:
    paths:
      - "src/cosmology/**"
      - "scripts/official-desi-posterior.mjs"
      - ".github/workflows/official-posterior.yml"

jobs:
  reproduce-desi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download official DESI DR2 chains and reproduce cosmic ages
        run: node scripts/official-desi-posterior.mjs
      - name: Show report
        run: cat artifacts/desi-official-age-posterior.md
      - name: Upload reproducibility artifact
        uses: actions/upload-artifact@v4
        with:
          name: desi-official-age-posterior
          path: artifacts/
          if-no-files-found: error
