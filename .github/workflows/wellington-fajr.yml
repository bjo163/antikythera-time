name: m-time-wellington-fajr

on:
  workflow_dispatch:
  push:
    paths:
      - "crates/mtime-worship/**"
      - "crates/mtime-hilal/**"
      - "crates/mtime-profile/**"
      - ".github/workflows/wellington-fajr.yml"

jobs:
  diyanet-wellington:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Download official DE440 and IERS EOP
        run: |
          mkdir -p /tmp/mtime-wellington
          curl --fail --retry 5 --retry-delay 3             "https://naif.jpl.nasa.gov/pub/naif/JUNO/kernels/spk/de440s.bsp"             -o /tmp/mtime-wellington/de440s.bsp
          curl --fail --retry 5 --retry-delay 3             "https://datacenter.iers.org/data/latestVersion/finals.all.iau2000.txt"             -o /tmp/mtime-wellington/finals.all

      - name: Compute Diyanet Wellington imsak/fajr
        run: |
          cargo run --quiet -p mtime-hilal --example validate_wellington_diyanet --             /tmp/mtime-wellington/de440s.bsp             /tmp/mtime-wellington/finals.all             | tee /tmp/mtime-wellington/report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mtime-wellington-diyanet-fajr
          path: /tmp/mtime-wellington/report.txt
