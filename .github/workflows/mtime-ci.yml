name: m-time-ci
on:
  workflow_dispatch:
  push:
    branches: [m-time-foundation]
    paths:
      - "m-time/**"
      - ".github/workflows/mtime-ci.yml"
  pull_request:
    paths:
      - "m-time/**"
      - ".github/workflows/mtime-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m-time
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p mtime-cli -- conformance
